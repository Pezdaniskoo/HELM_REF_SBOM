name: Setup SPDX workflow tools
description: Install SPDX SBOM lifecycle tools for the Helm SPDX workflow.

runs:
  using: composite
  steps:
    - name: Prepare base packages
      shell: bash
      run: |
        set -euo pipefail

        mkdir -p "$GITHUB_WORKSPACE/build-logs/helm"

        sudo apt-get update
        sudo apt-get install -y \
          ca-certificates \
          curl \
          git \
          jq \
          tar \
          unzip \
          wget \
          zip

        echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

    - name: Record runtime versions
      shell: bash
      run: |
        {
          echo "go: $(go version)"
          echo "python: $(python --version)"
          echo "node: $(node --version)"
          echo "npm: $(npm --version)"
          echo "jq: $(jq --version)"
          echo "git: $(git --version)"
        } | tee "$GITHUB_WORKSPACE/build-logs/helm/runtime-versions.txt"

    - name: Install Syft
      shell: bash
      run: |
        set -euo pipefail

        curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
          | sudo sh -s -- -b /usr/local/bin

        syft version | tee "$GITHUB_WORKSPACE/build-logs/helm/syft-version.txt"

    - name: Install Kubernetes bom
      shell: bash
      run: |
        set +e

        GOBIN="$(go env GOPATH)/bin"

        go install sigs.k8s.io/bom/cmd/bom@latest
        BOM_EXIT=$?

        if [ "$BOM_EXIT" -eq 0 ] && [ -x "$GOBIN/bom" ]; then
          "$GOBIN/bom" version 2>&1 | tee "$GITHUB_WORKSPACE/build-logs/helm/bom-version.txt" || true
          echo '{"status":"success","method":"go install","module":"sigs.k8s.io/bom/cmd/bom"}' \
            > "$GITHUB_WORKSPACE/build-logs/helm/bom-install-status.json"
        else
          echo "bom installation failed" | tee "$GITHUB_WORKSPACE/build-logs/helm/bom-version.txt"
          echo '{"status":"failed","reason":"go install failed"}' \
            > "$GITHUB_WORKSPACE/build-logs/helm/bom-install-status.json"
        fi

        exit 0

    - name: Install spdx-sbom-generator
      shell: bash
      run: |
        set +e

        VERSION="v0.0.15"
        TMP_DIR="$(mktemp -d)"

        curl -L \
          "https://github.com/opensbom-generator/spdx-sbom-generator/releases/download/${VERSION}/spdx-sbom-generator-${VERSION}-linux-amd64.tar.gz" \
          -o "$TMP_DIR/spdx-sbom-generator.tar.gz"

        CURL_EXIT=$?

        if [ "$CURL_EXIT" -ne 0 ]; then
          echo "spdx-sbom-generator download failed" | tee "$GITHUB_WORKSPACE/build-logs/helm/spdx-sbom-generator-version.txt"
          echo '{"status":"failed","reason":"download failed; Syft remains the primary SPDX generator"}' \
            > "$GITHUB_WORKSPACE/build-logs/helm/spdx-sbom-generator-install-status.json"
          exit 0
        fi

        tar -xzf "$TMP_DIR/spdx-sbom-generator.tar.gz" -C "$TMP_DIR"

        BIN_PATH="$(find "$TMP_DIR" -type f -name spdx-sbom-generator | head -n 1 || true)"

        if [ -n "$BIN_PATH" ]; then
          chmod +x "$BIN_PATH"
          sudo install -m 0755 "$BIN_PATH" /usr/local/bin/spdx-sbom-generator

          spdx-sbom-generator -h 2>&1 | head -n 20 \
            | tee "$GITHUB_WORKSPACE/build-logs/helm/spdx-sbom-generator-version.txt" || true

          echo '{"status":"success","method":"release binary","version":"v0.0.15","note":"tool is archived/deprecated; Syft remains primary"}' \
            > "$GITHUB_WORKSPACE/build-logs/helm/spdx-sbom-generator-install-status.json"
        else
          echo "spdx-sbom-generator binary not found in archive" \
            | tee "$GITHUB_WORKSPACE/build-logs/helm/spdx-sbom-generator-version.txt"

          echo '{"status":"failed","reason":"binary not found in release archive; Syft remains the primary SPDX generator"}' \
            > "$GITHUB_WORKSPACE/build-logs/helm/spdx-sbom-generator-install-status.json"
        fi

        exit 0

    - name: Install SPDX Python tools and NTIA checker
      shell: bash
      run: |
        set +e

        python -m pip install --upgrade pip

        python -m pip install \
          spdx-tools \
          ntia-conformance-checker \
          2>&1 | tee "$GITHUB_WORKSPACE/build-logs/helm/spdx-python-tools-install.log"

        python -m pip show spdx-tools ntia-conformance-checker \
          > "$GITHUB_WORKSPACE/build-logs/helm/spdx-python-tools-version.txt" 2>&1 || true

        if command -v ntia-checker >/dev/null 2>&1; then
          ntia-checker --help > "$GITHUB_WORKSPACE/build-logs/helm/ntia-checker-version.txt" 2>&1 || true
        elif command -v ntia-conformance-checker >/dev/null 2>&1; then
          ntia-conformance-checker --help > "$GITHUB_WORKSPACE/build-logs/helm/ntia-checker-version.txt" 2>&1 || true
        else
          echo "NTIA checker command not found after pip install" \
            > "$GITHUB_WORKSPACE/build-logs/helm/ntia-checker-version.txt"
        fi

        exit 0

    - name: Install sbomqs
      shell: bash
      run: |
        set -euo pipefail

        GOBIN="$(go env GOPATH)/bin"

        go install github.com/interlynk-io/sbomqs@latest

        "$GOBIN/sbomqs" version 2>&1 \
          | tee "$GITHUB_WORKSPACE/build-logs/helm/sbomqs-version.txt" || true

    - name: Install sbom-scorecard
      shell: bash
      run: |
        set +e

        GOBIN="$(go env GOPATH)/bin"

        go install github.com/ebay/sbom-scorecard/cmd/sbom-scorecard@latest
        SCORECARD_EXIT=$?

        if [ "$SCORECARD_EXIT" -eq 0 ] && [ -x "$GOBIN/sbom-scorecard" ]; then
          "$GOBIN/sbom-scorecard" help 2>&1 \
            | head -n 30 \
            | tee "$GITHUB_WORKSPACE/build-logs/helm/sbom-scorecard-version.txt" || true

          echo '{"status":"success","method":"go install","module":"github.com/ebay/sbom-scorecard/cmd/sbom-scorecard"}' \
            > "$GITHUB_WORKSPACE/build-logs/helm/sbom-scorecard-install-status.json"
        else
          echo "sbom-scorecard installation failed" \
            | tee "$GITHUB_WORKSPACE/build-logs/helm/sbom-scorecard-version.txt"

          echo '{"status":"failed","reason":"go install failed"}' \
            > "$GITHUB_WORKSPACE/build-logs/helm/sbom-scorecard-install-status.json"
        fi

        exit 0

    - name: Install OpenVEX vexctl
      shell: bash
      run: |
        set +e

        GOBIN="$(go env GOPATH)/bin"

        go install github.com/openvex/vexctl@latest
        VEX_EXIT=$?

        if [ "$VEX_EXIT" -eq 0 ] && [ -x "$GOBIN/vexctl" ]; then
          "$GOBIN/vexctl" version 2>&1 \
            | tee "$GITHUB_WORKSPACE/build-logs/helm/vexctl-version.txt" || true

          echo '{"status":"success","method":"go install"}' \
            > "$GITHUB_WORKSPACE/build-logs/helm/vexctl-install-status.json"
        else
          echo "vexctl installation failed" \
            | tee "$GITHUB_WORKSPACE/build-logs/helm/vexctl-version.txt"

          echo '{"status":"failed","reason":"go install failed"}' \
            > "$GITHUB_WORKSPACE/build-logs/helm/vexctl-install-status.json"
        fi

        exit 0