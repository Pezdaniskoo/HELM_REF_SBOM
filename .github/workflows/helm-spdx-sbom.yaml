name: Helm SPDX SBOM

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - helm-spdx-senior-style
  pull_request:

permissions:
  contents: read
  pull-requests: read
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: helm-spdx-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_DIR: source
  HELM_REPOSITORY: helm/helm
  HELM_REF: 68977ec0b5a446286668170dd72bdf59695f8cd5
  HELM_VERSION: 68977ec0b5a446286668170dd72bdf59695f8cd5
  SBOM_DIR: sbom/helm
  ARTIFACT_INPUT_DIR: sbom-input-helm
  VALIDATION_DIR: validation-results/helm
  QUALITY_DIR: quality-results/helm
  REVIEW_DIR: review-results/helm
  SIGNING_DIR: signing-results/helm
  VEX_DIR: vex/helm
  BUILD_LOG_DIR: build-logs/helm

jobs:
  spdx-sbom:
    name: Build, generate, validate and review SPDX SBOMs
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Checkout pinned Helm source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.HELM_REPOSITORY }}
          ref: ${{ env.HELM_REF }}
          path: ${{ env.PROJECT_DIR }}
          fetch-depth: 1

      - name: Show repository context
        run: |
          mkdir -p "$BUILD_LOG_DIR"

          echo "Repository: $GITHUB_REPOSITORY"
          echo "Ref: $GITHUB_REF"
          echo "Commit: $GITHUB_SHA"
          echo "Helm repository: $HELM_REPOSITORY"
          echo "Helm ref: $HELM_REF"
          echo "Helm version label: $HELM_VERSION"
          echo "Project directory: $PROJECT_DIR"

          echo
          echo "Root directory:"
          ls -la

          echo
          echo "Project directory:"
          ls -la "$PROJECT_DIR"

          echo
          echo "Detected Go files:"
          find "$PROJECT_DIR" -maxdepth 4 -type f \( -name "go.mod" -o -name "go.sum" \) | sort || true

          echo
          echo "Checked out Helm commit:"
          git -C "$PROJECT_DIR" rev-parse HEAD | tee "$BUILD_LOG_DIR/helm-source-commit.txt"

          echo
          echo "Helm internal version file:"
          grep -n "version =" "$PROJECT_DIR/internal/version/version.go" || true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: source/go.mod
          cache: true
          cache-dependency-path: source/go.sum

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up SPDX workflow tools
        uses: ./.github/actions/setup-spdx-tools

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.0

      - name: Check Cosign version
        run: |
          mkdir -p "$BUILD_LOG_DIR"
          cosign version 2>&1 | tee "$BUILD_LOG_DIR/cosign-version.txt"

      - name: Build Helm
        run: |
          mkdir -p "$BUILD_LOG_DIR"

          cd "$PROJECT_DIR"

          make build 2>&1 | tee "$GITHUB_WORKSPACE/$BUILD_LOG_DIR/go-build.log"

      - name: Collect build artifacts
        if: always()
        run: |
          rm -rf "$ARTIFACT_INPUT_DIR"
          mkdir -p "$ARTIFACT_INPUT_DIR/bin" "$BUILD_LOG_DIR"

          if [ -f "$PROJECT_DIR/bin/helm" ]; then
            cp "$PROJECT_DIR/bin/helm" "$ARTIFACT_INPUT_DIR/bin/helm"
          fi

          echo "Collected artifacts:"
          find "$ARTIFACT_INPUT_DIR" -type f | sort | tee "$BUILD_LOG_DIR/collected-artifacts.txt"

          echo
          echo "Collected artifact count:"
          find "$ARTIFACT_INPUT_DIR" -type f | wc -l

      - name: Generate source SPDX SBOM with Syft
        run: |
          mkdir -p "$SBOM_DIR/source" "$BUILD_LOG_DIR"

          syft dir:"$PROJECT_DIR" \
            --source-name Helm-Source \
            --source-version "$HELM_VERSION" \
            -o spdx-json="$SBOM_DIR/source/helm.source.syft.spdx.json" \
            2>&1 | tee "$BUILD_LOG_DIR/source-spdx-syft-generation.log"

          jq -e '.spdxVersion and .packages' "$SBOM_DIR/source/helm.source.syft.spdx.json" >/dev/null

      - name: Generate source SPDX SBOM with bom
        if: always()
        continue-on-error: true
        run: |
          mkdir -p "$SBOM_DIR/source" "$BUILD_LOG_DIR"

          BOM_FILE="$SBOM_DIR/source/helm.source.bom.spdx"
          STATUS_FILE="$SBOM_DIR/source/bom-status.json"
          LOG_FILE="$BUILD_LOG_DIR/source-spdx-bom-generation.log"

          if ! command -v bom >/dev/null 2>&1; then
            echo "bom command not available. Skipping." | tee "$LOG_FILE"
            echo '{"status":"skipped","reason":"bom command not available"}' > "$STATUS_FILE"
            exit 0
          fi

          set +e
          bom generate \
            -d "$PROJECT_DIR" \
            -o "$BOM_FILE" \
            2>&1 | tee "$LOG_FILE"
          BOM_EXIT=${PIPESTATUS[0]}
          set -e

          if [ "$BOM_EXIT" -eq 0 ] && [ -s "$BOM_FILE" ]; then
            if head -n 5 "$BOM_FILE" | grep -q "SPDXVersion:"; then
              echo '{"status":"success","format":"spdx-tag-value","file":"sbom/helm/source/helm.source.bom.spdx"}' \
                > "$STATUS_FILE"
            else
              echo '{"status":"warning","reason":"bom output exists but does not look like SPDX tag-value"}' \
                > "$STATUS_FILE"
            fi
          else
            echo '{"status":"failed","reason":"bom did not produce a valid output; see log"}' > "$STATUS_FILE"
          fi

      - name: Generate source SPDX SBOM with spdx-sbom-generator
        if: always()
        continue-on-error: true
        run: |
          mkdir -p "$SBOM_DIR/source" "$BUILD_LOG_DIR"

          STATUS_FILE="$SBOM_DIR/source/spdx-sbom-generator-status.json"
          LOG_FILE="$BUILD_LOG_DIR/source-spdx-generator-generation.log"
          GEN_OUT="$SBOM_DIR/source/spdx-sbom-generator-output"

          rm -rf "$GEN_OUT"
          mkdir -p "$GEN_OUT"

          if ! command -v spdx-sbom-generator >/dev/null 2>&1; then
            echo "spdx-sbom-generator command not available. Skipping." | tee "$LOG_FILE"
            echo '{"status":"skipped","reason":"spdx-sbom-generator command not available"}' > "$STATUS_FILE"
            exit 0
          fi

          set +e
          (
            cd "$PROJECT_DIR"
            spdx-sbom-generator \
              -p "." \
              -o "$GITHUB_WORKSPACE/$GEN_OUT" \
              -f JSON \
              2>&1 | tee "$GITHUB_WORKSPACE/$LOG_FILE"
          )
          GENERATOR_EXIT=${PIPESTATUS[0]}
          set -e

          GENERATED_FILE="$(find "$GEN_OUT" -type f -name "*.json" | head -n 1 || true)"

          if [ "$GENERATOR_EXIT" -eq 0 ] && [ -n "$GENERATED_FILE" ] && jq -e . "$GENERATED_FILE" >/dev/null 2>&1; then
            cp "$GENERATED_FILE" "$SBOM_DIR/source/helm.source.spdx-sbom-generator.spdx.json"
            echo '{"status":"success","format":"spdx-json","note":"tool is archived/deprecated; Syft remains primary"}' \
              > "$STATUS_FILE"
          else
            echo '{"status":"failed","reason":"spdx-sbom-generator did not produce valid JSON output; Syft remains primary"}' \
              > "$STATUS_FILE"
          fi

      - name: Export GitHub SBOM for Helm repository if available
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$SBOM_DIR/source" "$BUILD_LOG_DIR"

          WRAPPER_FILE="$SBOM_DIR/source/helm.source.github-wrapper.json"
          SPDX_FILE="$SBOM_DIR/source/helm.source.github.spdx.json"
          STATUS_FILE="$SBOM_DIR/source/github-sbom-status.json"
          LOG_FILE="$BUILD_LOG_DIR/github-sbom-export.log"

          set +e
          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${HELM_REPOSITORY}/dependency-graph/sbom" \
            > "$WRAPPER_FILE" \
            2> "$LOG_FILE"
          GH_SBOM_EXIT=$?
          set -e

          if [ "$GH_SBOM_EXIT" -eq 0 ] && jq -e '.sbom.spdxVersion and .sbom.packages' "$WRAPPER_FILE" >/dev/null 2>&1; then
            jq '.sbom' "$WRAPPER_FILE" > "$SPDX_FILE"
            echo '{"status":"success","format":"spdx-json","note":"extracted .sbom from GitHub API wrapper"}' \
              > "$STATUS_FILE"
          else
            rm -f "$SPDX_FILE"
            echo '{"status":"skipped_or_failed","reason":"GitHub SBOM export not available for this repository or token"}' \
              > "$STATUS_FILE"
          fi

      - name: Generate artifact SPDX SBOM with Syft
        if: always()
        run: |
          mkdir -p "$SBOM_DIR/artifacts" "$BUILD_LOG_DIR"

          if [ "$(find "$ARTIFACT_INPUT_DIR" -type f | wc -l)" -gt 0 ]; then
            syft dir:"$ARTIFACT_INPUT_DIR" \
              --source-name Helm-Build-Artifacts \
              --source-version "$HELM_VERSION" \
              -o spdx-json="$SBOM_DIR/artifacts/helm.artifacts.syft.spdx.json" \
              2>&1 | tee "$BUILD_LOG_DIR/artifact-spdx-syft-generation.log"

            jq -e '.spdxVersion and .packages' "$SBOM_DIR/artifacts/helm.artifacts.syft.spdx.json" >/dev/null
          else
            echo "No build artifacts found. Skipping artifact SPDX SBOM generation." \
              | tee "$BUILD_LOG_DIR/artifact-spdx-syft-generation.log"
          fi

      - name: Validate source SPDX SBOM structure
        if: always()
        continue-on-error: true
        run: |
          mkdir -p "$VALIDATION_DIR"

          SPDX_FILE="$SBOM_DIR/source/helm.source.syft.spdx.json"
          OUT_FILE="$VALIDATION_DIR/source-spdx-structure-validation.txt"

          if [ ! -f "$SPDX_FILE" ]; then
            echo "Source SPDX SBOM not found. Skipping validation." | tee "$OUT_FILE"
            exit 0
          fi

          python - <<'PY' "$SPDX_FILE" "$OUT_FILE"
          import json
          import sys
          from pathlib import Path

          sbom_path = Path(sys.argv[1])
          out_path = Path(sys.argv[2])

          data = json.loads(sbom_path.read_text())

          required = ["spdxVersion", "SPDXID", "name", "creationInfo", "packages"]
          missing = [key for key in required if key not in data]

          lines = [
              f"File: {sbom_path}",
              "Validation type: basic SPDX JSON structure check",
              f"SPDX version: {data.get('spdxVersion', 'missing')}",
              f"Packages: {len(data.get('packages', []))}",
              f"Relationships: {len(data.get('relationships', []))}",
          ]

          if missing:
              lines.append("Status: failed")
              lines.append(f"Missing required fields: {', '.join(missing)}")
          else:
              lines.append("Status: success")

          out_path.write_text("\n".join(lines) + "\n")
          print(out_path.read_text())

          sys.exit(1 if missing else 0)
          PY

      - name: Validate source SPDX SBOM with NTIA conformance checker
        if: always()
        continue-on-error: true
        run: |
          mkdir -p "$VALIDATION_DIR"

          if command -v ntia-checker >/dev/null 2>&1; then
            NTIA_CMD="ntia-checker"
          elif command -v ntia-conformance-checker >/dev/null 2>&1; then
            NTIA_CMD="ntia-conformance-checker"
          else
            NTIA_CMD=""
          fi

          if [ -n "$NTIA_CMD" ] && [ -f "$SBOM_DIR/source/helm.source.syft.spdx.json" ]; then
            "$NTIA_CMD" "$SBOM_DIR/source/helm.source.syft.spdx.json" \
              2>&1 | tee "$VALIDATION_DIR/source-ntia-conformance.txt" || true
          else
            echo "NTIA conformance checker command not available or source SBOM missing." \
              | tee "$VALIDATION_DIR/source-ntia-conformance.txt"
          fi

      - name: Validate artifact SPDX SBOM structure
        if: always()
        continue-on-error: true
        run: |
          mkdir -p "$VALIDATION_DIR"

          SPDX_FILE="$SBOM_DIR/artifacts/helm.artifacts.syft.spdx.json"
          OUT_FILE="$VALIDATION_DIR/artifact-spdx-structure-validation.txt"

          if [ ! -f "$SPDX_FILE" ]; then
            echo "Artifact SPDX SBOM not found. Skipping validation." | tee "$OUT_FILE"
            exit 0
          fi

          python - <<'PY' "$SPDX_FILE" "$OUT_FILE"
          import json
          import sys
          from pathlib import Path

          sbom_path = Path(sys.argv[1])
          out_path = Path(sys.argv[2])

          data = json.loads(sbom_path.read_text())

          required = ["spdxVersion", "SPDXID", "name", "creationInfo", "packages"]
          missing = [key for key in required if key not in data]

          lines = [
              f"File: {sbom_path}",
              "Validation type: basic SPDX JSON structure check",
              f"SPDX version: {data.get('spdxVersion', 'missing')}",
              f"Packages: {len(data.get('packages', []))}",
              f"Relationships: {len(data.get('relationships', []))}",
          ]

          if missing:
              lines.append("Status: failed")
              lines.append(f"Missing required fields: {', '.join(missing)}")
          else:
              lines.append("Status: success")

          out_path.write_text("\n".join(lines) + "\n")
          print(out_path.read_text())

          sys.exit(1 if missing else 0)
          PY

      - name: Assess source SPDX SBOM quality with sbomqs
        if: always()
        continue-on-error: true
        run: |
          mkdir -p "$QUALITY_DIR"

          if [ -f "$SBOM_DIR/source/helm.source.syft.spdx.json" ]; then
            sbomqs score "$SBOM_DIR/source/helm.source.syft.spdx.json" \
              2>&1 | tee "$QUALITY_DIR/source-sbomqs-score.txt" || true

            sbomqs score "$SBOM_DIR/source/helm.source.syft.spdx.json" --json \
              > "$QUALITY_DIR/source-sbomqs-score.json" || true
          else
            echo "Source SPDX SBOM not found. Skipping quality assessment." \
              | tee "$QUALITY_DIR/source-sbomqs-score.txt"
          fi

      - name: Assess artifact SPDX SBOM quality with sbomqs
        if: always()
        continue-on-error: true
        run: |
          mkdir -p "$QUALITY_DIR"

          if [ -f "$SBOM_DIR/artifacts/helm.artifacts.syft.spdx.json" ]; then
            sbomqs score "$SBOM_DIR/artifacts/helm.artifacts.syft.spdx.json" \
              2>&1 | tee "$QUALITY_DIR/artifact-sbomqs-score.txt" || true

            sbomqs score "$SBOM_DIR/artifacts/helm.artifacts.syft.spdx.json" --json \
              > "$QUALITY_DIR/artifact-sbomqs-score.json" || true
          else
            echo "Artifact SPDX SBOM not found. Skipping quality assessment." \
              | tee "$QUALITY_DIR/artifact-sbomqs-score.txt"
          fi

      - name: Assess SPDX SBOM quality with sbom-scorecard
        if: always()
        continue-on-error: true
        run: |
          mkdir -p "$QUALITY_DIR"

          STATUS_FILE="$QUALITY_DIR/sbom-scorecard-status.json"

          if ! command -v sbom-scorecard >/dev/null 2>&1; then
            echo "sbom-scorecard command not available. Skipping." \
              | tee "$QUALITY_DIR/sbom-scorecard-status.txt"

            echo '{"status":"skipped","reason":"sbom-scorecard command not available"}' \
              > "$STATUS_FILE"
            exit 0
          fi

          SCORECARD_STATUS="success"

          if [ -f "$SBOM_DIR/source/helm.source.syft.spdx.json" ]; then
            sbom-scorecard score --sbomtype spdx "$SBOM_DIR/source/helm.source.syft.spdx.json" \
              2>&1 | tee "$QUALITY_DIR/source-sbom-scorecard.txt" || SCORECARD_STATUS="partial"
          fi

          if [ -f "$SBOM_DIR/artifacts/helm.artifacts.syft.spdx.json" ]; then
            sbom-scorecard score --sbomtype spdx "$SBOM_DIR/artifacts/helm.artifacts.syft.spdx.json" \
              2>&1 | tee "$QUALITY_DIR/artifact-sbom-scorecard.txt" || SCORECARD_STATUS="partial"
          fi

          jq -n \
            --arg status "$SCORECARD_STATUS" \
            --arg tool "sbom-scorecard" \
            '{status:$status, tool:$tool}' \
            > "$STATUS_FILE"

      - name: Generate GitHub SBOM attestation for Helm artifact
        id: attest_artifact_sbom
        if: ${{ always() && hashFiles('sbom-input-helm/bin/helm') != '' && hashFiles('sbom/helm/artifacts/helm.artifacts.syft.spdx.json') != '' }}
        continue-on-error: true
        uses: actions/attest@v4
        with:
          subject-path: ${{ github.workspace }}/sbom-input-helm/bin/helm
          sbom-path: ${{ github.workspace }}/sbom/helm/artifacts/helm.artifacts.syft.spdx.json

      - name: Record GitHub attestation status
        if: always()
        run: |
          mkdir -p "$SIGNING_DIR/github-attestations"

          STATUS_FILE="$SIGNING_DIR/github-attestation-status.json"
          ATTESTATION_PATHS_FILE="${RUNNER_TEMP}/created_attestation_paths.txt"

          if [ -f "$ATTESTATION_PATHS_FILE" ] && [ -s "$ATTESTATION_PATHS_FILE" ]; then
            i=1
            while IFS= read -r attestation_path; do
              if [ -f "$attestation_path" ]; then
                cp "$attestation_path" "$SIGNING_DIR/github-attestations/attestation-${i}.json"
                i=$((i + 1))
              fi
            done < "$ATTESTATION_PATHS_FILE"

            jq -n \
              --arg status "success" \
              --arg tool "actions/attest@v4" \
              --arg subject "sbom-input-helm/bin/helm" \
              --arg sbom "sbom/helm/artifacts/helm.artifacts.syft.spdx.json" \
              '{status:$status, tool:$tool, subject:$subject, sbom:$sbom}' \
              > "$STATUS_FILE"
          else
            jq -n \
              --arg status "failed_or_not_available" \
              --arg tool "actions/attest@v4" \
              --arg reason "No attestation bundle path was created. Check the actions/attest step logs." \
              '{status:$status, tool:$tool, reason:$reason}' \
              > "$STATUS_FILE"
          fi

          cat "$STATUS_FILE"

      - name: Sign SPDX SBOMs with Cosign keyless
        if: always()
        continue-on-error: true
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: |
          mkdir -p "$SIGNING_DIR"

          SOURCE_SBOM="$SBOM_DIR/source/helm.source.syft.spdx.json"
          ARTIFACT_SBOM="$SBOM_DIR/artifacts/helm.artifacts.syft.spdx.json"
          STATUS_FILE="$SIGNING_DIR/cosign-status.json"

          if ! command -v cosign >/dev/null 2>&1; then
            echo "Cosign command not available. Skipping signing." | tee "$SIGNING_DIR/cosign-status.log"
            echo '{"status":"skipped","reason":"cosign command not available"}' > "$STATUS_FILE"
            exit 0
          fi

          SOURCE_STATUS="missing"
          ARTIFACT_STATUS="missing"

          if [ -f "$SOURCE_SBOM" ]; then
            set +e
            cosign sign-blob "$SOURCE_SBOM" \
              --yes \
              --bundle "$SIGNING_DIR/helm.source.syft.spdx.bundle.json" \
              2>&1 | tee "$SIGNING_DIR/source-cosign-sign.log"
            SOURCE_EXIT=${PIPESTATUS[0]}
            set -e

            if [ "$SOURCE_EXIT" -eq 0 ] && [ -f "$SIGNING_DIR/helm.source.syft.spdx.bundle.json" ]; then
              SOURCE_STATUS="success"
            else
              SOURCE_STATUS="failed"
            fi
          else
            echo "Source SPDX SBOM not found. Skipping source signing." | tee "$SIGNING_DIR/source-cosign-sign.log"
          fi

          if [ -f "$ARTIFACT_SBOM" ]; then
            set +e
            cosign sign-blob "$ARTIFACT_SBOM" \
              --yes \
              --bundle "$SIGNING_DIR/helm.artifacts.syft.spdx.bundle.json" \
              2>&1 | tee "$SIGNING_DIR/artifact-cosign-sign.log"
            ARTIFACT_EXIT=${PIPESTATUS[0]}
            set -e

            if [ "$ARTIFACT_EXIT" -eq 0 ] && [ -f "$SIGNING_DIR/helm.artifacts.syft.spdx.bundle.json" ]; then
              ARTIFACT_STATUS="success"
            else
              ARTIFACT_STATUS="failed"
            fi
          else
            echo "Artifact SPDX SBOM not found. Skipping artifact signing." | tee "$SIGNING_DIR/artifact-cosign-sign.log"
          fi

          jq -n \
            --arg status "completed" \
            --arg tool "cosign sign-blob" \
            --arg source "$SOURCE_STATUS" \
            --arg artifact "$ARTIFACT_STATUS" \
            '{status:$status, tool:$tool, source_sbom:$source, artifact_sbom:$artifact}' \
            > "$STATUS_FILE"

          cat "$STATUS_FILE"

      - name: Record FOSSology stage status
        if: always()
        run: |
          mkdir -p "$REVIEW_DIR/fossology"

          {
            echo "# FOSSology status"
            echo
            echo "FOSSology is included in SPDX workflow stage 6 as the license compliance review and decision-history system."
            echo
            echo "Current status: pending configuration."
            echo
            echo "Reason: FOSSology requires a reachable server, API token and folder ID."
            echo
            echo "Required future secrets:"
            echo "- FOSSOLOGY_URL"
            echo "- FOSSOLOGY_TOKEN"
            echo "- FOSSOLOGY_FOLDER_ID"
            echo
            echo "Prepared input files:"
            echo "- $SBOM_DIR/source/helm.source.syft.spdx.json"
            echo "- $SBOM_DIR/artifacts/helm.artifacts.syft.spdx.json"
          } > "$REVIEW_DIR/fossology/fossology-stage-status.md"

          jq -n \
            --arg status "pending_configuration" \
            --arg tool "FOSSology" \
            --arg reason "FOSSology server/API configuration not provided yet; sbomify integration is being tested first" \
            '{status:$status, tool:$tool, reason:$reason}' \
            > "$REVIEW_DIR/fossology/fossology-review-status.json"

          cat "$REVIEW_DIR/fossology/fossology-stage-status.md"
          cat "$REVIEW_DIR/fossology/fossology-review-status.json"

      - name: Prepare sbomify metadata
        if: always()
        run: |
          mkdir -p "$REVIEW_DIR/sbomify"

          cat > sbomify.json <<JSON
          {
            "lifecycle_phase": "build",
            "supplier": {
              "name": "Helm Project",
              "url": ["https://github.com/helm/helm"]
            },
            "authors": [
              {
                "name": "GitHub Actions SPDX SBOM workflow"
              }
            ],
            "licenses": ["Apache-2.0"],
            "vcs_url": "https://github.com/helm/helm",
            "vcs_commit_sha": "$HELM_REF",
            "vcs_ref": "$HELM_REF"
          }
          JSON

          cp sbomify.json "$REVIEW_DIR/sbomify/sbomify.json"
          cat "$REVIEW_DIR/sbomify/sbomify.json"

      - name: Require sbomify configuration
        if: always()
        env:
          SBOMIFY_TOKEN: ${{ secrets.SBOMIFY_TOKEN }}
          SBOMIFY_COMPONENT_ID: ${{ secrets.SBOMIFY_COMPONENT_ID }}
        run: |
          mkdir -p "$REVIEW_DIR/sbomify"

          STATUS_FILE="$REVIEW_DIR/sbomify/sbomify-status.json"

          if [ -z "$SBOMIFY_TOKEN" ] || [ -z "$SBOMIFY_COMPONENT_ID" ]; then
            {
              echo "sbomify is required by SPDX workflow stage 6."
              echo "Missing required repository secrets:"
              echo "- SBOMIFY_TOKEN"
              echo "- SBOMIFY_COMPONENT_ID"
              echo
              echo "Your current sbomify component ID should be stored as SBOMIFY_COMPONENT_ID."
            } | tee "$REVIEW_DIR/sbomify/sbomify-required.log"

            jq -n \
              --arg status "failed" \
              --arg tool "sbomify" \
              --arg reason "SBOMIFY_TOKEN or SBOMIFY_COMPONENT_ID is not configured" \
              '{status:$status, tool:$tool, reason:$reason}' \
              > "$STATUS_FILE"

            cat "$STATUS_FILE"
            exit 1
          fi

          echo "::add-mask::$SBOMIFY_TOKEN"
          echo "sbomify configuration is available." | tee "$REVIEW_DIR/sbomify/sbomify-required.log"

      - name: Upload source SPDX SBOM to sbomify
        if: always()
        uses: sbomify/sbomify-action@master
        env:
          TOKEN: ${{ secrets.SBOMIFY_TOKEN }}
          COMPONENT_ID: ${{ secrets.SBOMIFY_COMPONENT_ID }}
          COMPONENT_NAME: Helm
          COMPONENT_VERSION: ${{ env.HELM_VERSION }}
          COMPONENT_PURL: pkg:github/helm/helm@${{ env.HELM_VERSION }}
          SBOM_FILE: ${{ github.workspace }}/sbom/helm/source/helm.source.syft.spdx.json
          OUTPUT_FILE: ${{ github.workspace }}/review-results/helm/sbomify/helm.source.sbomify.enriched.spdx.json
          SBOM_FORMAT: spdx
          UPLOAD: true
          UPLOAD_DESTINATIONS: sbomify
          AUGMENT: true
          ENRICH: true

      - name: Record sbomify upload status
        if: always()
        run: |
          mkdir -p "$REVIEW_DIR/sbomify"

          STATUS_FILE="$REVIEW_DIR/sbomify/sbomify-status.json"
          OUTPUT_FILE="$REVIEW_DIR/sbomify/helm.source.sbomify.enriched.spdx.json"

          if [ -f "$OUTPUT_FILE" ] && jq -e '.spdxVersion and .packages' "$OUTPUT_FILE" >/dev/null 2>&1; then
            PACKAGE_COUNT="$(jq '.packages | length' "$OUTPUT_FILE")"

            jq -n \
              --arg status "success" \
              --arg tool "sbomify" \
              --arg sbom "$OUTPUT_FILE" \
              --arg component "Helm" \
              --arg version "$HELM_VERSION" \
              --argjson packages "$PACKAGE_COUNT" \
              '{status:$status, tool:$tool, sbom:$sbom, component:$component, version:$version, packages:$packages}' \
              > "$STATUS_FILE"
          else
            jq -n \
              --arg status "failed" \
              --arg tool "sbomify" \
              --arg reason "sbomify action did not produce a valid enriched SPDX SBOM output" \
              '{status:$status, tool:$tool, reason:$reason}' \
              > "$STATUS_FILE"

            cat "$STATUS_FILE"
            exit 1
          fi

          cat "$STATUS_FILE"

      - name: Produce OpenVEX document
        if: always()
        run: |
          mkdir -p "$VEX_DIR"

          PRODUCT_ID="pkg:generic/helm@${HELM_VERSION}"
          VEX_TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          VEX_ID="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/openvex/helm-spdx"

          jq -n \
            --arg id "$VEX_ID" \
            --arg author "GitHub Actions" \
            --arg timestamp "$VEX_TIMESTAMP" \
            --arg product "$PRODUCT_ID" \
            '{
              "@context": "https://openvex.dev/ns/v0.2.0",
              "@id": $id,
              "author": $author,
              "timestamp": $timestamp,
              "version": 1,
              "statements": [],
              "metadata": {
                "product": $product,
                "note": "OpenVEX placeholder for SPDX workflow. Vulnerability exploitability statements can be added later when vulnerability findings are available."
              }
            }' > "$VEX_DIR/helm.openvex.json"

          {
            echo "# Helm OpenVEX summary"
            echo
            echo "OpenVEX file: \`$VEX_DIR/helm.openvex.json\`"
            echo
            echo "Generated statements: 0"
            echo
            echo "Reason: this SPDX-focused workflow is centered on SBOM generation, validation, quality, storage, license review and tracking."
          } > "$VEX_DIR/vex-summary.md"

          cat "$VEX_DIR/vex-summary.md"

      - name: Record CSAF VEX status
        if: always()
        run: |
          mkdir -p "$VEX_DIR"

          {
            echo "# CSAF VEX status"
            echo
            echo "CSAF VEX tooling is represented in this SPDX reference workflow as an optional publication path."
            echo
            echo "A final CSAF VEX advisory is not generated automatically in this run because there are no vulnerability findings and no manual product impact decisions."
            echo
            echo "OpenVEX placeholder output is available at:"
            echo "- $VEX_DIR/helm.openvex.json"
          } > "$VEX_DIR/csaf-vex-status.md"

          echo '{"status":"prepared","tool":"CSAF/Secvisogram","reason":"CSAF VEX publication requires vulnerability findings and manual impact decisions"}' \
            > "$VEX_DIR/csaf-vex-status.json"

      - name: Validate OpenVEX structure
        if: always()
        run: |
          VEX_FILE="$VEX_DIR/helm.openvex.json"

          jq -e '
            .["@context"] == "https://openvex.dev/ns/v0.2.0"
            and (.["@id"] | type == "string")
            and (.author | type == "string")
            and (.timestamp | type == "string")
            and (.version | type == "number")
            and (.statements | type == "array")
          ' "$VEX_FILE" 2>&1 | tee "$VEX_DIR/openvex-structure-check.log"

      - name: Generate traceability manifest
        if: always()
        run: |
          mkdir -p "$SBOM_DIR"

          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg ref "$GITHUB_REF" \
            --arg commit "$GITHUB_SHA" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg helm_repository "$HELM_REPOSITORY" \
            --arg helm_ref "$HELM_REF" \
            --arg helm_commit "$(cat "$BUILD_LOG_DIR/helm-source-commit.txt" 2>/dev/null || echo unknown)" \
            --arg project_dir "$PROJECT_DIR" \
            --arg source_sbom "$SBOM_DIR/source/helm.source.syft.spdx.json" \
            --arg artifact_sbom "$SBOM_DIR/artifacts/helm.artifacts.syft.spdx.json" \
            --arg validation "$VALIDATION_DIR" \
            --arg quality "$QUALITY_DIR" \
            --arg review "$REVIEW_DIR" \
            --arg signing "$SIGNING_DIR" \
            --arg vex "$VEX_DIR/helm.openvex.json" \
            '{
              repository: $repository,
              ref: $ref,
              commit: $commit,
              workflow_run_id: $run_id,
              workflow_run_attempt: $run_attempt,
              source: {
                helm_repository: $helm_repository,
                helm_ref: $helm_ref,
                helm_checked_out_commit: $helm_commit,
                project_directory: $project_dir
              },
              lifecycle: {
                build: "Go / make build",
                source_sbom_generation: ["Syft", "bom", "spdx-sbom-generator optional", "GitHub SBOM export if available"],
                artifact_sbom_generation: "Syft",
                schema_validation: ["basic SPDX JSON structure check", "NTIA conformance checker"],
                quality_assessment: ["sbomqs", "sbom-scorecard"],
                attestation: "actions/attest@v4 SBOM attestation for Helm binary",
                signing: ["Cosign", "Sigstore keyless"],
                artifact_storage: "actions/upload-artifact@v4",
                review_and_tracking: ["FOSSology stage recorded pending configuration", "sbomify upload/enrichment/tracking"],
                vex: ["OpenVEX placeholder", "CSAF VEX status placeholder"]
              },
              artifacts: {
                source_sbom: $source_sbom,
                artifact_sbom: $artifact_sbom,
                validation_results: $validation,
                quality_results: $quality,
                review_results: $review,
                signing_results: $signing,
                vex: $vex
              }
            }' > "$SBOM_DIR/manifest.json"

          cat "$SBOM_DIR/manifest.json"

      - name: Generate final summary
        if: always()
        run: |
          mkdir -p "$SBOM_DIR"

          status_line() {
            label="$1"
            file="$2"

            if [ -f "$file" ]; then
              status="$(jq -r '.status // "unknown"' "$file" 2>/dev/null || echo "available")"
              echo "- $label: \`$status\`"
            else
              echo "- $label: \`not generated\`"
            fi
          }

          {
            echo "# Helm SPDX SBOM summary"
            echo
            echo "Repository: $GITHUB_REPOSITORY"
            echo "Ref: $GITHUB_REF"
            echo "Commit: $GITHUB_SHA"
            echo "Helm repository: $HELM_REPOSITORY"
            echo "Helm ref: $HELM_REF"
            echo "Helm checked out commit: $(cat "$BUILD_LOG_DIR/helm-source-commit.txt" 2>/dev/null || echo unknown)"
            echo "Project directory: $PROJECT_DIR"
            echo
            echo "## Lifecycle stage"
            echo
            echo "Current milestone: build + SPDX SBOM generation + SPDX validation + quality assessment + attestation/signing + artifact storage + sbomify tracking + VEX placeholder"
            echo
            echo "## Tool status overview"
            echo
            status_line "bom source SBOM" "$SBOM_DIR/source/bom-status.json"
            status_line "spdx-sbom-generator source SBOM" "$SBOM_DIR/source/spdx-sbom-generator-status.json"
            status_line "GitHub SBOM export" "$SBOM_DIR/source/github-sbom-status.json"
            status_line "sbom-scorecard" "$QUALITY_DIR/sbom-scorecard-status.json"
            status_line "GitHub SBOM attestation" "$SIGNING_DIR/github-attestation-status.json"
            status_line "Cosign signing" "$SIGNING_DIR/cosign-status.json"
            status_line "FOSSology stage" "$REVIEW_DIR/fossology/fossology-review-status.json"
            status_line "sbomify upload/enrichment/tracking" "$REVIEW_DIR/sbomify/sbomify-status.json"
            status_line "CSAF VEX status" "$VEX_DIR/csaf-vex-status.json"
            echo
            echo "## Tooling"
            echo
            echo "- Build: Go / make build"
            echo "- Primary source SBOM generation: Syft"
            echo "- Secondary source SBOM generation: bom"
            echo "- Optional source SBOM generation: spdx-sbom-generator"
            echo "- Optional source SBOM generation: GitHub SBOM export"
            echo "- Artifact SBOM generation: Syft"
            echo "- SBOM validation: basic SPDX JSON structure check"
            echo "- SBOM validation: NTIA conformance checker"
            echo "- SBOM quality assessment: sbomqs"
            echo "- SBOM quality assessment: sbom-scorecard"
            echo "- Attestation: actions/attest@v4"
            echo "- Signing: Cosign / Sigstore keyless"
            echo "- Artifact storage: actions/upload-artifact@v4"
            echo "- Store, review and track: sbomify upload, enrichment and tracking"
            echo "- Store, review and track: FOSSology stage recorded as pending configuration"
            echo "- VEX: OpenVEX placeholder and CSAF VEX status"
            echo "- SBOM standard: SPDX"
            echo "- Output format: JSON for Syft/GitHub/spdx-sbom-generator/sbomify, tag-value for bom"
            echo
            for section in \
              "Generated source SBOM files:$SBOM_DIR/source" \
              "Generated artifact SBOM files:$SBOM_DIR/artifacts" \
              "Validation results:$VALIDATION_DIR" \
              "Quality results:$QUALITY_DIR" \
              "Review and tracking results:$REVIEW_DIR" \
              "Signing results:$SIGNING_DIR" \
              "VEX results:$VEX_DIR"; do
              title="${section%%:*}"
              dir="${section#*:}"
              echo "## $title"
              echo
              if [ -d "$dir" ]; then
                find "$dir" -type f | sort | while read file; do
                  size=$(wc -c < "$file")
                  echo "- \`$file\` (${size} bytes)"
                done
              else
                echo "- No files generated"
              fi
              echo
            done

            echo "## Collected build artifacts"
            echo
            if [ -f "$BUILD_LOG_DIR/collected-artifacts.txt" ]; then
              echo "- Count: $(wc -l < "$BUILD_LOG_DIR/collected-artifacts.txt")"
            else
              echo "- Count: unavailable"
            fi
          } > "$SBOM_DIR/summary.md"

          cat "$SBOM_DIR/summary.md"

      - name: Upload full SPDX SBOM lifecycle results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: helm-spdx-sbom-lifecycle-results
          retention-days: 7
          path: |
            sbom/helm/
            build-logs/helm/
            validation-results/helm/
            quality-results/helm/
            review-results/helm/
            signing-results/helm/
            vex/helm/
            sbom-input-helm/