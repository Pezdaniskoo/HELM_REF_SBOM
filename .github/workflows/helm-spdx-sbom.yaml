name: Helm SPDX SBOM

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - helm-spdx-senior-style
  pull_request:

permissions:
  contents: read
  pull-requests: read
  id-token: write
  attestations: write

concurrency:
  group: helm-spdx-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_DIR: source
  HELM_REPOSITORY: helm/helm
  # Use a fixed commit SHA here when you want fully reproducible source checkout.
  # Keeping main is convenient during PoC work, but a pinned SHA is better for final evidence.
  HELM_REF: main
  HELM_VERSION: main
  SBOM_DIR: sbom/helm
  ARTIFACT_INPUT_DIR: sbom-input-helm
  VALIDATION_DIR: validation-results/helm
  QUALITY_DIR: quality-results/helm
  REVIEW_DIR: review-results/helm
  SIGNING_DIR: signing-results/helm
  VEX_DIR: vex/helm
  BUILD_LOG_DIR: build-logs/helm

jobs:
  spdx-sbom:
    name: Build, generate, validate and review SPDX SBOMs
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:

      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Checkout pinned Helm source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.HELM_REPOSITORY }}
          ref: ${{ env.HELM_REF }}
          path: ${{ env.PROJECT_DIR }}
          fetch-depth: 1

      - name: Show repository context
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Ref: $GITHUB_REF"
          echo "Commit: $GITHUB_SHA"
          echo "Helm repository: $HELM_REPOSITORY"
          echo "Helm ref: $HELM_REF"
          echo "Helm version label: $HELM_VERSION"
          echo "Project directory: $PROJECT_DIR"
          echo
          echo "Root directory:"
          ls -la
          echo
          echo "Project directory:"
          ls -la "$PROJECT_DIR"
          echo
          echo "Detected Go files:"
          find "$PROJECT_DIR" -maxdepth 4 -type f \( -name "go.mod" -o -name "go.sum" \) | sort || true
          echo
          echo "Helm internal version file:"
          grep -n "version =" "$PROJECT_DIR/internal/version/version.go" || true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: source/go.mod
          cache: true
          cache-dependency-path: source/go.sum

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up SPDX workflow tools
        uses: ./.github/actions/setup-spdx-tools

      - name: Build Helm
        run: |
          cd "$PROJECT_DIR"
          make build 2>&1 | tee "$GITHUB_WORKSPACE/$BUILD_LOG_DIR/go-build.log"

      - name: Collect build artifacts
        if: always()
        run: |
          rm -rf "$ARTIFACT_INPUT_DIR"
          mkdir -p "$ARTIFACT_INPUT_DIR/bin" "$BUILD_LOG_DIR"

          if [ -f "$PROJECT_DIR/bin/helm" ]; then
            cp "$PROJECT_DIR/bin/helm" "$ARTIFACT_INPUT_DIR/bin/helm"
          fi

          echo "Collected artifacts:"
          find "$ARTIFACT_INPUT_DIR" -type f | sort | tee "$BUILD_LOG_DIR/collected-artifacts.txt"
          echo
          echo "Collected artifact count:"
          find "$ARTIFACT_INPUT_DIR" -type f | wc -l

      - name: Generate source SPDX SBOM with Syft
        run: |
          mkdir -p "$SBOM_DIR/source" "$BUILD_LOG_DIR"

          syft dir:"$PROJECT_DIR" \
            --source-name Helm-Source \
            --source-version "$HELM_VERSION" \
            -o spdx-json="$SBOM_DIR/source/helm.source.syft.spdx.json" \
            2>&1 | tee "$BUILD_LOG_DIR/source-spdx-syft-generation.log"

      - name: Generate source SPDX SBOM with bom
        continue-on-error: true
        run: |
          mkdir -p "$SBOM_DIR/source" "$BUILD_LOG_DIR"

          if ! command -v bom >/dev/null 2>&1; then
            echo "bom command not available. Skipping." | tee "$BUILD_LOG_DIR/source-spdx-bom-generation.log"
            echo '{"status":"skipped","reason":"bom command not available"}' > "$SBOM_DIR/source/bom-status.json"
            exit 0
          fi

          set +e
          bom generate \
            -d "$PROJECT_DIR" \
            -o "$SBOM_DIR/source/helm.source.bom.spdx.json" \
            2>&1 | tee "$BUILD_LOG_DIR/source-spdx-bom-generation.log"
          BOM_EXIT=${PIPESTATUS[0]}
          set -e

          if [ "$BOM_EXIT" -eq 0 ] && [ -f "$SBOM_DIR/source/helm.source.bom.spdx.json" ]; then
            echo '{"status":"success"}' > "$SBOM_DIR/source/bom-status.json"
          else
            echo '{"status":"failed","reason":"bom did not produce a valid output; see log"}' > "$SBOM_DIR/source/bom-status.json"
          fi

      - name: Generate source SPDX SBOM with spdx-sbom-generator
        continue-on-error: true
        run: |
          mkdir -p "$SBOM_DIR/source" "$BUILD_LOG_DIR"

          if ! command -v spdx-sbom-generator >/dev/null 2>&1; then
            echo "spdx-sbom-generator command not available. Skipping." | tee "$BUILD_LOG_DIR/source-spdx-generator-generation.log"
            echo '{"status":"skipped","reason":"spdx-sbom-generator command not available"}' > "$SBOM_DIR/source/spdx-sbom-generator-status.json"
            exit 0
          fi

          set +e
          (
            cd "$PROJECT_DIR"
            spdx-sbom-generator \
              -o "$GITHUB_WORKSPACE/$SBOM_DIR/source" \
              2>&1 | tee "$GITHUB_WORKSPACE/$BUILD_LOG_DIR/source-spdx-generator-generation.log"
          )
          GENERATOR_EXIT=${PIPESTATUS[0]}
          set -e

          GENERATED_FILE=$(find "$SBOM_DIR/source" -type f \( -name "*.spdx" -o -name "*.spdx.json" -o -name "bom-*.json" \) | head -n 1 || true)

          if [ "$GENERATOR_EXIT" -eq 0 ] && [ -n "$GENERATED_FILE" ]; then
            cp "$GENERATED_FILE" "$SBOM_DIR/source/helm.source.spdx-sbom-generator.spdx.json" || true
            echo '{"status":"success"}' > "$SBOM_DIR/source/spdx-sbom-generator-status.json"
          else
            echo '{"status":"failed","reason":"spdx-sbom-generator did not produce output; see log"}' > "$SBOM_DIR/source/spdx-sbom-generator-status.json"
          fi

      - name: Export GitHub SBOM for Helm repository if available
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$SBOM_DIR/source" "$BUILD_LOG_DIR"

          set +e
          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${HELM_REPOSITORY}/dependency-graph/sbom" \
            > "$SBOM_DIR/source/helm.source.github.spdx.json" \
            2> "$BUILD_LOG_DIR/github-sbom-export.log"
          GH_SBOM_EXIT=$?
          set -e

          if [ "$GH_SBOM_EXIT" -eq 0 ] && jq -e . "$SBOM_DIR/source/helm.source.github.spdx.json" >/dev/null 2>&1; then
            echo '{"status":"success"}' > "$SBOM_DIR/source/github-sbom-status.json"
          else
            rm -f "$SBOM_DIR/source/helm.source.github.spdx.json"
            echo '{"status":"skipped_or_failed","reason":"GitHub SBOM export not available for this repository or token"}' > "$SBOM_DIR/source/github-sbom-status.json"
          fi

      - name: Generate artifact SPDX SBOM with Syft
        if: always()
        run: |
          mkdir -p "$SBOM_DIR/artifacts" "$BUILD_LOG_DIR"

          if [ "$(find "$ARTIFACT_INPUT_DIR" -type f | wc -l)" -gt 0 ]; then
            syft dir:"$ARTIFACT_INPUT_DIR" \
              --source-name Helm-Build-Artifacts \
              --source-version "$HELM_VERSION" \
              -o spdx-json="$SBOM_DIR/artifacts/helm.artifacts.syft.spdx.json" \
              2>&1 | tee "$BUILD_LOG_DIR/artifact-spdx-syft-generation.log"
          else
            echo "No build artifacts found. Skipping artifact SPDX SBOM generation." | tee "$BUILD_LOG_DIR/artifact-spdx-syft-generation.log"
          fi

      - name: Validate source SPDX SBOM structure
        if: always()
        continue-on-error: true
        run: |
          mkdir -p "$VALIDATION_DIR"
          SPDX_FILE="$SBOM_DIR/source/helm.source.syft.spdx.json"

          if [ ! -f "$SPDX_FILE" ]; then
            echo "Source SPDX SBOM not found. Skipping validation." | tee "$VALIDATION_DIR/source-spdx-structure-validation.txt"
            exit 0
          fi

          python - <<'PY' "$SPDX_FILE" "$VALIDATION_DIR/source-spdx-structure-validation.txt"
          import json
          import sys
          from pathlib import Path

          sbom_path = Path(sys.argv[1])
          out_path = Path(sys.argv[2])
          data = json.loads(sbom_path.read_text())
          required = ["spdxVersion", "SPDXID", "name", "creationInfo", "packages"]
          missing = [key for key in required if key not in data]
          lines = [
              f"File: {sbom_path}",
              "Validation type: basic SPDX JSON structure check",
              f"SPDX version: {data.get('spdxVersion', 'missing')}",
              f"Packages: {len(data.get('packages', []))}",
          ]
          if missing:
              lines.append("Status: failed")
              lines.append(f"Missing required fields: {', '.join(missing)}")
          else:
              lines.append("Status: success")
          out_path.write_text("\n".join(lines) + "\n")
          print(out_path.read_text())
          sys.exit(1 if missing else 0)
          PY

      - name: Validate source SPDX SBOM with NTIA conformance checker
        if: always()
        continue-on-error: true
        run: |
          mkdir -p "$VALIDATION_DIR"

          if command -v ntia-checker >/dev/null 2>&1; then
            NTIA_CMD="ntia-checker"
          elif command -v ntia-conformance-checker >/dev/null 2>&1; then
            NTIA_CMD="ntia-conformance-checker"
          else
            NTIA_CMD=""
          fi

          if [ -n "$NTIA_CMD" ] && [ -f "$SBOM_DIR/source/helm.source.syft.spdx.json" ]; then
            "$NTIA_CMD" "$SBOM_DIR/source/helm.source.syft.spdx.json" \
              2>&1 | tee "$VALIDATION_DIR/source-ntia-conformance.txt" || true
          else
            echo "NTIA conformance checker command not available or source SBOM missing." | tee "$VALIDATION_DIR/source-ntia-conformance.txt"
          fi

      - name: Validate artifact SPDX SBOM structure
        if: always()
        continue-on-error: true
        run: |
          mkdir -p "$VALIDATION_DIR"
          SPDX_FILE="$SBOM_DIR/artifacts/helm.artifacts.syft.spdx.json"

          if [ ! -f "$SPDX_FILE" ]; then
            echo "Artifact SPDX SBOM not found. Skipping validation." | tee "$VALIDATION_DIR/artifact-spdx-structure-validation.txt"
            exit 0
          fi

          python - <<'PY' "$SPDX_FILE" "$VALIDATION_DIR/artifact-spdx-structure-validation.txt"
          import json
          import sys
          from pathlib import Path

          sbom_path = Path(sys.argv[1])
          out_path = Path(sys.argv[2])
          data = json.loads(sbom_path.read_text())
          required = ["spdxVersion", "SPDXID", "name", "creationInfo", "packages"]
          missing = [key for key in required if key not in data]
          lines = [
              f"File: {sbom_path}",
              "Validation type: basic SPDX JSON structure check",
              f"SPDX version: {data.get('spdxVersion', 'missing')}",
              f"Packages: {len(data.get('packages', []))}",
          ]
          if missing:
              lines.append("Status: failed")
              lines.append(f"Missing required fields: {', '.join(missing)}")
          else:
              lines.append("Status: success")
          out_path.write_text("\n".join(lines) + "\n")
          print(out_path.read_text())
          sys.exit(1 if missing else 0)
          PY

      - name: Assess source SPDX SBOM quality with sbomqs
        if: always()
        continue-on-error: true
        run: |
          mkdir -p "$QUALITY_DIR"

          if [ -f "$SBOM_DIR/source/helm.source.syft.spdx.json" ]; then
            sbomqs score "$SBOM_DIR/source/helm.source.syft.spdx.json" \
              2>&1 | tee "$QUALITY_DIR/source-sbomqs-score.txt" || true
            sbomqs score "$SBOM_DIR/source/helm.source.syft.spdx.json" --json \
              > "$QUALITY_DIR/source-sbomqs-score.json" || true
          else
            echo "Source SPDX SBOM not found. Skipping quality assessment." | tee "$QUALITY_DIR/source-sbomqs-score.txt"
          fi

      - name: Assess artifact SPDX SBOM quality with sbomqs
        if: always()
        continue-on-error: true
        run: |
          mkdir -p "$QUALITY_DIR"

          if [ -f "$SBOM_DIR/artifacts/helm.artifacts.syft.spdx.json" ]; then
            sbomqs score "$SBOM_DIR/artifacts/helm.artifacts.syft.spdx.json" \
              2>&1 | tee "$QUALITY_DIR/artifact-sbomqs-score.txt" || true
            sbomqs score "$SBOM_DIR/artifacts/helm.artifacts.syft.spdx.json" --json \
              > "$QUALITY_DIR/artifact-sbomqs-score.json" || true
          else
            echo "Artifact SPDX SBOM not found. Skipping quality assessment." | tee "$QUALITY_DIR/artifact-sbomqs-score.txt"
          fi

      - name: Assess SPDX SBOM quality with sbom-scorecard
        if: always()
        continue-on-error: true
        run: |
          mkdir -p "$QUALITY_DIR"

          if command -v sbom-scorecard >/dev/null 2>&1; then
            if [ -f "$SBOM_DIR/source/helm.source.syft.spdx.json" ]; then
              sbom-scorecard "$SBOM_DIR/source/helm.source.syft.spdx.json" \
                2>&1 | tee "$QUALITY_DIR/source-sbom-scorecard.txt" || true
            fi
            if [ -f "$SBOM_DIR/artifacts/helm.artifacts.syft.spdx.json" ]; then
              sbom-scorecard "$SBOM_DIR/artifacts/helm.artifacts.syft.spdx.json" \
                2>&1 | tee "$QUALITY_DIR/artifact-sbom-scorecard.txt" || true
            fi
          else
            echo "sbom-scorecard command not available. Skipping." | tee "$QUALITY_DIR/sbom-scorecard-status.txt"
          fi

      - name: Generate GitHub artifact attestation for source SBOM
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$SIGNING_DIR"
          SOURCE_SBOM="$SBOM_DIR/source/helm.source.syft.spdx.json"

          if [ ! -f "$SOURCE_SBOM" ]; then
            echo "Source SPDX SBOM not found. Skipping attestation." | tee "$SIGNING_DIR/source-gh-attestation.log"
            echo '{"status":"skipped","reason":"source SBOM missing"}' > "$SIGNING_DIR/source-gh-attestation-status.json"
            exit 0
          fi

          set +e
          gh attestation sign "$SOURCE_SBOM" \
            2>&1 | tee "$SIGNING_DIR/source-gh-attestation.log"
          ATTESTATION_EXIT=${PIPESTATUS[0]}
          set -e

          if [ "$ATTESTATION_EXIT" -eq 0 ]; then
            echo '{"status":"success","tool":"gh attestation"}' > "$SIGNING_DIR/source-gh-attestation-status.json"
          else
            echo '{"status":"failed_or_unsupported","tool":"gh attestation","reason":"see source-gh-attestation.log"}' > "$SIGNING_DIR/source-gh-attestation-status.json"
          fi

      - name: Sign SPDX SBOM with Cosign keyless
        if: always()
        continue-on-error: true
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: |
          mkdir -p "$SIGNING_DIR"
          SOURCE_SBOM="$SBOM_DIR/source/helm.source.syft.spdx.json"
          ARTIFACT_SBOM="$SBOM_DIR/artifacts/helm.artifacts.syft.spdx.json"

          if ! command -v cosign >/dev/null 2>&1; then
            echo "Cosign command not available. Skipping signing." | tee "$SIGNING_DIR/cosign-status.log"
            echo '{"status":"skipped","reason":"cosign command not available"}' > "$SIGNING_DIR/cosign-status.json"
            exit 0
          fi

          if [ -f "$SOURCE_SBOM" ]; then
            cosign sign-blob "$SOURCE_SBOM" \
              --yes \
              --bundle "$SIGNING_DIR/helm.source.syft.spdx.bundle.json" \
              2>&1 | tee "$SIGNING_DIR/source-cosign-sign.log" || true
          else
            echo "Source SPDX SBOM not found. Skipping source signing." | tee "$SIGNING_DIR/source-cosign-sign.log"
          fi

          if [ -f "$ARTIFACT_SBOM" ]; then
            cosign sign-blob "$ARTIFACT_SBOM" \
              --yes \
              --bundle "$SIGNING_DIR/helm.artifacts.syft.spdx.bundle.json" \
              2>&1 | tee "$SIGNING_DIR/artifact-cosign-sign.log" || true
          else
            echo "Artifact SPDX SBOM not found. Skipping artifact signing." | tee "$SIGNING_DIR/artifact-cosign-sign.log"
          fi

      - name: Record FOSSology review status
        if: always()
        run: |
          mkdir -p "$REVIEW_DIR/fossology"

          {
            echo "# FOSSology review status"
            echo
            echo "FOSSology is included in the SPDX reference workflow as the license compliance review tool."
            echo
            echo "This CI workflow generated SPDX SBOM artifacts that can be imported into FOSSology for manual or centralized license review."
            echo
            echo "Automated FOSSology upload is not executed here because it requires a configured FOSSology server and API credentials."
            echo
            echo "Primary input SBOM:"
            echo "- $SBOM_DIR/source/helm.source.syft.spdx.json"
            echo
            echo "Artifact SBOM:"
            echo "- $SBOM_DIR/artifacts/helm.artifacts.syft.spdx.json"
          } > "$REVIEW_DIR/fossology/fossology-review-status.md"

          echo '{"status":"prepared","tool":"FOSSology","reason":"SBOMs generated for external license compliance review"}' \
            > "$REVIEW_DIR/fossology/fossology-review-status.json"

          cat "$REVIEW_DIR/fossology/fossology-review-status.md"

      - name: Upload SPDX SBOM to sbomify if configured
        if: always()
        env:
          SBOMIFY_TOKEN: ${{ secrets.SBOMIFY_TOKEN }}
          SBOMIFY_COMPONENT_ID: ${{ secrets.SBOMIFY_COMPONENT_ID }}
        run: |
          mkdir -p "$REVIEW_DIR/sbomify"
          SBOM_FILE="$SBOM_DIR/source/helm.source.syft.spdx.json"

          if [ -z "$SBOMIFY_TOKEN" ] || [ -z "$SBOMIFY_COMPONENT_ID" ]; then
            {
              echo "sbomify token or component ID is not configured. Skipping upload."
              echo
              echo "Required secrets:"
              echo "- SBOMIFY_TOKEN"
              echo "- SBOMIFY_COMPONENT_ID"
            } | tee "$REVIEW_DIR/sbomify/sbomify-upload.log"

            echo '{"status":"skipped","reason":"SBOMIFY_TOKEN or SBOMIFY_COMPONENT_ID not configured"}' \
              > "$REVIEW_DIR/sbomify/sbomify-status.json"
            exit 0
          fi

          if [ ! -f "$SBOM_FILE" ]; then
            echo "SPDX SBOM not found. Skipping sbomify upload." | tee "$REVIEW_DIR/sbomify/sbomify-upload.log"
            echo '{"status":"skipped","reason":"SPDX SBOM not found"}' > "$REVIEW_DIR/sbomify/sbomify-status.json"
            exit 0
          fi

          echo "sbomify upload is configured but endpoint details depend on the target sbomify setup." \
            | tee "$REVIEW_DIR/sbomify/sbomify-upload.log"
          echo '{"status":"configured","reason":"sbomify secrets detected; organization-specific upload endpoint can be added"}' \
            > "$REVIEW_DIR/sbomify/sbomify-status.json"

      - name: Produce OpenVEX document
        if: always()
        run: |
          mkdir -p "$VEX_DIR"
          PRODUCT_ID="pkg:generic/helm@${HELM_VERSION}"
          VEX_TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          VEX_ID="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/openvex/helm-spdx"

          jq -n \
            --arg id "$VEX_ID" \
            --arg author "GitHub Actions" \
            --arg timestamp "$VEX_TIMESTAMP" \
            --arg product "$PRODUCT_ID" \
            '{
              "@context": "https://openvex.dev/ns/v0.2.0",
              "@id": $id,
              "author": $author,
              "timestamp": $timestamp,
              "version": 1,
              "statements": [],
              "metadata": {
                "product": $product,
                "note": "OpenVEX placeholder for SPDX workflow. Vulnerability exploitability statements can be added later when vulnerability findings are available."
              }
            }' > "$VEX_DIR/helm.openvex.json"

          {
            echo "# Helm OpenVEX summary"
            echo
            echo "OpenVEX file: \`$VEX_DIR/helm.openvex.json\`"
            echo
            echo "Generated statements: 0"
            echo
            echo "Reason: this SPDX-focused workflow is centered on SBOM generation, validation, quality, storage, license review and tracking."
          } > "$VEX_DIR/vex-summary.md"

          cat "$VEX_DIR/vex-summary.md"

      - name: Record CSAF VEX status
        if: always()
        run: |
          mkdir -p "$VEX_DIR"

          {
            echo "# CSAF VEX status"
            echo
            echo "CSAF VEX tooling is represented in this SPDX reference workflow as an optional publication path."
            echo
            echo "A final CSAF VEX advisory is not generated automatically in this run because there are no vulnerability findings and no manual product impact decisions."
            echo
            echo "OpenVEX placeholder output is available at:"
            echo "- $VEX_DIR/helm.openvex.json"
          } > "$VEX_DIR/csaf-vex-status.md"

          echo '{"status":"prepared","tool":"CSAF/Secvisogram","reason":"CSAF VEX publication requires vulnerability findings and manual impact decisions"}' \
            > "$VEX_DIR/csaf-vex-status.json"

      - name: Validate OpenVEX structure
        if: always()
        run: |
          VEX_FILE="$VEX_DIR/helm.openvex.json"
          jq -e '
            .["@context"] == "https://openvex.dev/ns/v0.2.0"
            and (.["@id"] | type == "string")
            and (.author | type == "string")
            and (.timestamp | type == "string")
            and (.version | type == "number")
            and (.statements | type == "array")
          ' "$VEX_FILE" 2>&1 | tee "$VEX_DIR/openvex-structure-check.log"

      - name: Generate traceability manifest
        if: always()
        run: |
          mkdir -p "$SBOM_DIR"

          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg ref "$GITHUB_REF" \
            --arg commit "$GITHUB_SHA" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg helm_repository "$HELM_REPOSITORY" \
            --arg helm_ref "$HELM_REF" \
            --arg project_dir "$PROJECT_DIR" \
            --arg source_sbom "$SBOM_DIR/source/helm.source.syft.spdx.json" \
            --arg artifact_sbom "$SBOM_DIR/artifacts/helm.artifacts.syft.spdx.json" \
            --arg validation "$VALIDATION_DIR" \
            --arg quality "$QUALITY_DIR" \
            --arg review "$REVIEW_DIR" \
            --arg signing "$SIGNING_DIR" \
            --arg vex "$VEX_DIR/helm.openvex.json" \
            '{
              repository: $repository,
              ref: $ref,
              commit: $commit,
              workflow_run_id: $run_id,
              workflow_run_attempt: $run_attempt,
              source: {
                helm_repository: $helm_repository,
                helm_ref: $helm_ref,
                project_directory: $project_dir
              },
              lifecycle: {
                build: "Go / make build",
                source_sbom_generation: ["Syft", "bom", "spdx-sbom-generator", "GitHub SBOM export if available"],
                artifact_sbom_generation: "Syft",
                schema_validation: ["basic SPDX JSON structure check", "NTIA conformance checker"],
                quality_assessment: ["sbomqs", "sbom-scorecard"],
                attestation: "GitHub CLI attestation if supported by runner GH CLI",
                signing: ["Cosign", "Sigstore keyless"],
                artifact_storage: "actions/upload-artifact@v4",
                review_and_tracking: ["FOSSology review preparation", "sbomify optional integration"],
                vex: ["OpenVEX placeholder", "CSAF VEX status placeholder"]
              },
              artifacts: {
                source_sbom: $source_sbom,
                artifact_sbom: $artifact_sbom,
                validation_results: $validation,
                quality_results: $quality,
                review_results: $review,
                signing_results: $signing,
                vex: $vex
              }
            }' > "$SBOM_DIR/manifest.json"

          cat "$SBOM_DIR/manifest.json"

      - name: Generate final summary
        if: always()
        run: |
          mkdir -p "$SBOM_DIR"

          {
            echo "# Helm SPDX SBOM summary"
            echo
            echo "Repository: $GITHUB_REPOSITORY"
            echo "Ref: $GITHUB_REF"
            echo "Commit: $GITHUB_SHA"
            echo "Helm repository: $HELM_REPOSITORY"
            echo "Helm ref: $HELM_REF"
            echo "Project directory: $PROJECT_DIR"
            echo
            echo "## Lifecycle stage"
            echo
            echo "Current milestone: build + SPDX SBOM generation + SPDX validation + quality assessment + attestation/signing + artifact storage + license review/tracking preparation + VEX placeholder"
            echo
            echo "## Tooling"
            echo
            echo "- Build: Go / make build"
            echo "- SBOM generation: Syft"
            echo "- SBOM generation: bom"
            echo "- SBOM generation: spdx-sbom-generator"
            echo "- SBOM generation: GitHub SBOM export if available"
            echo "- SBOM validation: basic SPDX JSON structure check"
            echo "- SBOM validation: NTIA conformance checker"
            echo "- SBOM quality assessment: sbomqs"
            echo "- SBOM quality assessment: sbom-scorecard"
            echo "- Attestation: GitHub CLI attestation"
            echo "- Signing: Cosign / Sigstore keyless"
            echo "- Artifact storage: actions/upload-artifact@v4"
            echo "- Store, review and track: FOSSology review preparation"
            echo "- Store, review and track: sbomify optional integration"
            echo "- VEX: OpenVEX placeholder and CSAF VEX status"
            echo "- SBOM standard: SPDX"
            echo "- Output format: JSON"
            echo
            for section in \
              "Generated source SBOM files:$SBOM_DIR/source" \
              "Generated artifact SBOM files:$SBOM_DIR/artifacts" \
              "Validation results:$VALIDATION_DIR" \
              "Quality results:$QUALITY_DIR" \
              "Review and tracking results:$REVIEW_DIR" \
              "Signing results:$SIGNING_DIR" \
              "VEX results:$VEX_DIR"; do
              title="${section%%:*}"
              dir="${section#*:}"
              echo "## $title"
              echo
              if [ -d "$dir" ]; then
                find "$dir" -type f | sort | while read file; do
                  size=$(wc -c < "$file")
                  echo "- \`$file\` (${size} bytes)"
                done
              else
                echo "- No files generated"
              fi
              echo
            done

            echo "## Collected build artifacts"
            echo
            if [ -f "$BUILD_LOG_DIR/collected-artifacts.txt" ]; then
              echo "- Count: $(wc -l < "$BUILD_LOG_DIR/collected-artifacts.txt")"
            else
              echo "- Count: unavailable"
            fi
          } > "$SBOM_DIR/summary.md"

          cat "$SBOM_DIR/summary.md"

      - name: Upload full SPDX SBOM lifecycle results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: helm-spdx-sbom-lifecycle-results
          retention-days: 7
          path: |
            sbom/helm/
            build-logs/helm/
            validation-results/helm/
            quality-results/helm/
            review-results/helm/
            signing-results/helm/
            vex/helm/
            sbom-input-helm/